name: Build ImmortalWrt for C3958 (x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查项目代码
      uses: actions/checkout@v4

    - name: 准备编译环境 (安装依赖)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo apt-get clean

    - name: 拉取 ImmortalWrt 源码
      run: |
        # 默认拉取 ImmortalWrt 23.05 稳定版分支
        git clone -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: 更新并安装 Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 拉取最新 OpenClash 源码
      working-directory: ./openwrt
      run: |
        # 从官方仓库拉取最新版并提取所需插件目录
        git clone --depth=1 https://github.com/vernesong/OpenClash.git package/OpenClash-repo
        cp -r package/OpenClash-repo/luci-app-openclash package/luci-app-openclash
        rm -rf package/OpenClash-repo

    - name: 生成配置 (.config) 并处理依赖冲突
      working-directory: ./openwrt
      run: |
        cat <<EOF > .config
        # ==========================================
        # 1. 基础架构配置
        # ==========================================
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_PACKAGE_luci=y
        
        # ==========================================
        # 2. OpenClash 专属配置 (防冲突)
        # ==========================================
        CONFIG_PACKAGE_dnsmasq=m
        CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_ruby=y
        CONFIG_PACKAGE_ruby-yaml=y
        
        # ==========================================
        # 3. 网卡驱动配置 (编译进固件核心)
        # ==========================================
        # Intel 全系网卡 (千兆/2.5G/万兆/40G)
        CONFIG_PACKAGE_kmod-e1000e=y
        CONFIG_PACKAGE_kmod-igb=y
        CONFIG_PACKAGE_kmod-igc=y
        CONFIG_PACKAGE_kmod-ixgbe=y
        CONFIG_PACKAGE_kmod-i40e=y
        # Mellanox CX4 网卡
        CONFIG_PACKAGE_kmod-mlx5-core=y
        EOF
        
        # 让 OpenWrt 自动补全剩余的隐式依赖
        make defconfig

    - name: 注入 C3958 内核驱动与串口引导参数
      working-directory: ./openwrt
      run: |
        # 自动寻找当前内核配置文件并追加 C3958 需要的 8250 串口和 PCI 驱动
        KERNEL_CONF=$(find target/linux/x86 -name "config-*" | head -n 1)
        echo "正在修改内核配置: $KERNEL_CONF"
        
        cat >> $KERNEL_CONF <<EOF
        CONFIG_SERIAL_8250=y
        CONFIG_SERIAL_8250_CONSOLE=y
        CONFIG_SERIAL_8250_PCI=y
        CONFIG_SERIAL_8250_PNP=y
        CONFIG_SERIAL_8250_DW=y
        CONFIG_SERIAL_8250_EXTENDED=y
        CONFIG_SERIAL_8250_SHARE_IRQ=y
        EOF
        
        # 强行修改 GRUB 引导文件，将内核输出重定向到第一个串口 ttyS0
        sed -i 's/console=tty0/console=tty0 console=ttyS0,115200n8/g' target/linux/x86/image/grub.cfg

    - name: 下载编译依赖资源包
      working-directory: ./openwrt
      run: make download -j8

    - name: 编译固件
      working-directory: ./openwrt
      run: |
        # 优先使用多线程全速编译，若遇到错误则单线程打印报错信息以便排查
        make -j$(nproc) || make -j1 V=s

    - name: 上传固件到 GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-C3958-Ultimate-Firmware
        path: openwrt/bin/targets/x86/64/*
