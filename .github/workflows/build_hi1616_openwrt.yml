name: Build ImmortalWrt for Kunpeng Hi1616 (ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查项目代码
      uses: actions/checkout@v4

    - name: 准备编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo apt-get clean

    - name: 拉取 ImmortalWrt 源码
      run: |
        # 使用 ImmortalWrt 23.05 源码
        git clone -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: 更新并安装 Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成 ARM64 专用配置 (.config)
      working-directory: ./openwrt
      run: |
        cat <<EOF > .config
        # ==========================================
        # 1. 基础架构配置 (ARM64 SystemReady)
        # ==========================================
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv8=y
        CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

        # ==========================================
        # 2. 常用插件 (OpenClash 等)
        # ==========================================
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_curl=y

        # ==========================================
        # 3. 核心驱动补丁 (确保新内核能驱动网卡)
        # ==========================================
        # 即使内核内建了驱动，我们也把对应的 kmod 选上以防万一
        CONFIG_PACKAGE_kmod-hns=y
        CONFIG_PACKAGE_kmod-hns3=y
        EOF
        
        # 自动补全依赖
        make defconfig

    - name: 注入华为海思 HNS 驱动与串口引导参数
      working-directory: ./openwrt
      run: |
        # 1. 修改内核配置：强制开启海思 HNS 网卡支持 (内建模式)
        KERNEL_CONF="target/linux/armsr/armv8/config-5.15"
        [ -f "$KERNEL_CONF" ] || KERNEL_CONF=$(find target/linux/armsr -name "config-5.15" | head -n 1)
        
        echo "正在修改内核配置: $KERNEL_CONF"
        cat >> $KERNEL_CONF <<EOF
        CONFIG_NET_VENDOR_HISILICON=y
        CONFIG_HNS=y
        CONFIG_HNS_DSAF=y
        CONFIG_HNS_ENET=y
        CONFIG_HNS3=y
        CONFIG_HNS3_HCLGE=y
        CONFIG_HNS3_ENET=y
        # 串口支持
        CONFIG_SERIAL_8250_DW=y
        CONFIG_SERIAL_AMBA_PL011=y
        CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
        EOF

        # 2. 修改引导参数：确保串口控制台正确指向 ttyS0 或 ttyAMA0
        # 鲲鹏服务器通常使用 ttyS0 (8250) 或 ttyAMA0 (PL011)
        sed -i 's/console=tty0/console=tty0 console=ttyS0,115200 console=ttyAMA0,115200/g' target/linux/armsr/image/Makefile 2>/dev/null || true

    - name: 下载资源包
      working-directory: ./openwrt
      run: make download -j8

    - name: 编译固件
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-Kunpeng-Hi1616-ARM64
        path: openwrt/bin/targets/armsr/armv8/*
